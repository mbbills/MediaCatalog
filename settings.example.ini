[runtime]
# Python command used by LibreOffice to start the helper scripts.
#
# Windows:
#   "py" may work, but a full python.exe path is more reliable when
#   LibreOffice launches Python. To find it:
#       py -c "import sys; print(sys.executable)"
#
# Linux:
#   python3
# Excel derives pythonw.exe from this setting for windowless IMDb lookups.
python = python


[progress]
# Show the shared progress/ETA window for network batch jobs. Its Cancel button
# preserves completed rows and leaves unfinished rows available for a later run.
show_window = true
always_on_top = true


[paths]
# Relative paths are resolved from the MediaCatalog project folder.
# Absolute paths are also accepted.
imdb_database = data/imdb.sqlite
imdb_source_dir = data/source
logs_dir = logs


[imdb]
# Official IMDb non-commercial dataset filenames.
title_basics = title.basics.tsv.gz
title_episode = title.episode.tsv.gz
title_ratings = title.ratings.tsv.gz


[bluray]
# Blu-ray.com's dedicated UPC/EAN database search is used for release titles.
# The separate detail command then opens the matched individual release page.
# The helper searches the DVD catalog first, then the Blu-ray/UHD catalog.
# Delay is applied between selected rows that require network requests.
request_delay_seconds = 0.75
timeout_seconds = 45


[upcitemdb]
# FREE-plan endpoint. UPCItemDB currently allows 100 combined requests per day
# and 6 requests per minute on the free plan, so keep at least 10 seconds
# between distinct codes. Duplicate codes within one selection are cached.
endpoint = https://api.upcitemdb.com/prod/trial/lookup?upc=
request_delay_seconds = 10.5
timeout_seconds = 45

# Paid DEV/PRO plans use /prod/v1/lookup plus the two headers below. Leave the
# key blank for the free /trial endpoint.
user_key =
key_type = 3scale


[barcodelookup]
# Barcode Lookup's terms prohibit automated use of a free test account.
# Subscribe at https://www.barcodelookup.com/api before enabling this resolver.
endpoint = https://api.barcodelookup.com/v3/products
api_key =
paid_subscription = false

# The published limit is 100 requests per minute. A 0.75-second delay keeps
# MediaCatalog below that ceiling; duplicate codes in one batch are cached.
request_delay_seconds = 0.75
timeout_seconds = 45
